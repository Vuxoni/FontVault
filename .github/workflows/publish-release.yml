name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Draft version without v prefix (for example 1.2.0)"
        required: true
        type: string
      confirmation:
        description: "Type PUBLISH to make the release public"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Approve and publish draft
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Validate explicit approval
        env:
          VERSION: ${{ inputs.version }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi
          if [[ "$CONFIRMATION" != "PUBLISH" ]]; then
            echo "Release was not published. Enter PUBLISH exactly to approve."
            exit 1
          fi

      - name: Verify draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: |
          IS_DRAFT="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .draft)"
          if [[ "$IS_DRAFT" != "true" ]]; then
            echo "$TAG does not exist as a draft release."
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Add summary
        run: |
          echo "## Release published" >> "$GITHUB_STEP_SUMMARY"
          echo "**v${{ inputs.version }}** is now public." >> "$GITHUB_STEP_SUMMARY"
